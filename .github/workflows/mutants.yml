name: Find mutants
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # The implicit "bash -e" lacks pipefail, which masks failures.

env:
  SHARDS: 64
  RUST_BACKTRACE: 1
  MUTANTS_ARGS: --no-shuffle --in-place --profile mutants -- --all-targets -- -Zunstable-options --fail-fast

jobs:
  baseline:
    name: Baseline test
    runs-on: ubuntu-24.04
    outputs:
      timeout: ${{ steps.baseline.outputs.timeout }}
      shards: ${{ steps.baseline.outputs.shards }}
      max_shard: ${{ steps.baseline.outputs.max_shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-build-deps
        with:
          version: nightly

      - name: Run baseline test
        id: baseline
        run: |
          SECONDS=0
          cargo test --locked --all-targets -- -Zunstable-options --fail-fast
          {
            # Minimum timeout is 30s, maximum is 90s, otherwise 3x the baseline test time.
            echo "timeout=$(( SECONDS * 3 < 30 ? 30 : SECONDS * 3 > 90 ? 90 : SECONDS * 3 ))"
            echo "shards=$(jq -nc '[$ARGS.positional[] | tonumber]' --args $(seq 0 $((SHARDS - 1))))"
            echo "max_shard=$((SHARDS - 1))"
          } >> "$GITHUB_OUTPUT"

  mutants:
    name: Find mutants (shard ${{ matrix.shard }}/${{ needs.baseline.outputs.max_shard }})
    needs: baseline
    runs-on: ubuntu-24.04
    # An aborted runner fails the job outright, skipping even always() steps;
    # if only the child is SIGTERM'd we see 143 below. actions/runner-images#6680
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.baseline.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-build-deps
        with:
          version: nightly
          tools: cargo-mutants

      - name: Find mutants
        env:
          TIMEOUT: ${{ needs.baseline.outputs.timeout }}
        run: |
          # shellcheck disable=SC2086
          # Exit codes 2 (uncaught mutants) and 3 (timeouts) are findings, not
          # errors: https://mutants.rs/exit-codes.html. On 143 (SIGTERM from an
          # aborted runner) drop the partial output.
          (cargo mutants --shard "$SHARD" --sharding round-robin --baseline=skip --timeout "$TIMEOUT" $MUTANTS_ARGS 2>&1 \
            || { ec=$?; case $ec in 2|3) exit 0 ;; 143) rm -rf mutants.out; exit 0 ;; esac; exit $ec; }) | tee results.txt

      # continue-on-error hides step failures, so carry them to the results job.
      - name: Record shard failure
        if: failure()
        run: |
          mkdir -p mutants.out
          echo "shard $SHARD failed, see the job log" > mutants.out/failed.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out
          retention-days: 1

  results:
    name: Results
    if: ${{ !cancelled() }}
    needs: mutants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants.out-*
          path: shards

      - name: Merge shard results
        run: |
          mkdir -p mutants.out
          # Move each shard to a subfolder and concatenate result files.
          for dir in shards/mutants.out-*; do
            shard="${dir##*-}"
            mv "$dir" "mutants.out/shard-$shard"
          done
          for category in caught missed timeout unviable failed; do
            cat mutants.out/shard-*/"$category.txt" 2>/dev/null | sort -u > "mutants.out/$category.txt" || true
            rm -f mutants.out/shard-*/"$category.txt"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: mutants.out
          path: mutants.out
          compression-level: 9

      - name: Post step summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          # Aborted shards upload no artifact; failed ones upload only failed.txt.
          reported=$(find mutants.out -maxdepth 1 -type d -name "shard-*" | wc -l | tr -d ' ')
          failed_shards=$(wc -l < mutants.out/failed.txt | tr -d ' ')
          done_shards=$((reported - failed_shards))
          [ "$done_shards" -eq "$SHARDS" ] || echo "::warning::only $done_shards/$SHARDS shards reported results"
          {
            echo "## Mutation Testing Results"
            echo "Shards completed: $done_shards/$SHARDS ($failed_shards failed)"
            echo ""
            echo "| Category | Count |"
            echo "|----------|------:|"
            for category in caught missed timeout unviable; do
              count=$(wc -l < "mutants.out/$category.txt" 2>/dev/null | tr -d ' ' || echo 0)
              echo "| $category | $count |"
            done
            echo ""
            for category in missed timeout; do
              if [ -s "mutants.out/$category.txt" ]; then
                echo "### Files with most $category mutants"
                echo '```'
                # Group by file, count occurrences, show top 10.
                cut -d: -f1 "mutants.out/$category.txt" | sort | uniq -c | sort -rn | sed -n '1,10p'
                echo '```'
              fi
            done
            echo ""
            echo "[Download full results]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on shard errors
        run: |
          [ -s mutants.out/failed.txt ] || exit 0
          cat mutants.out/failed.txt
          exit 1
