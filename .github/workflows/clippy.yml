name: Clippy
on:
  pull_request:
    # `edited` so a retargeted PR gets a run, see codspeed.yml. Only base changes run jobs.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  push:
    branches: ["main"] # Only to populate the Rust cache
  workflow_dispatch:

concurrency:
  # Non-base edits skip all jobs, so they must not cancel the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchains:
    name: Determine toolchains
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    outputs:
      toolchains: ${{ steps.toolchains.outputs.toolchains }}
      cacheable: ${{ steps.cacheable.outputs.toolchains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toolchains
        uses: mozilla/actions/toolchains@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0

      # Nightly never uses a cache, so main runs have no reason to build it.
      - id: cacheable
        env:
          TOOLCHAINS: ${{ steps.toolchains.outputs.toolchains }}
        run: echo "toolchains=$(jq -c 'map(select(. != "nightly"))' <<<"$TOOLCHAINS")" >> "$GITHUB_OUTPUT"

  clippy:
    name: cargo clippy
    needs: toolchains
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        rust-toolchain: ${{ fromJSON(github.event_name == 'push' && needs.toolchains.outputs.cacheable || needs.toolchains.outputs.toolchains) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-build-deps
        with:
          version: ${{ matrix.rust-toolchain }}
          components: clippy
          tools: cargo-hack

      # Run clippy across all meaningful feature combinations.
      - run: cargo hack clippy --locked --feature-powerset --all-targets --exclude-features gecko,ci --mutually-exclusive-features bench,blapi,build-fuzzing-corpus,default,disable-encryption -- -D warnings
      # Fuzz targets and fuzzing-only APIs only build with `--cfg fuzzing`, and not on Windows.
      - if: runner.os != 'Windows'
        run: RUSTFLAGS="--cfg fuzzing $RUSTFLAGS" cargo clippy --locked -p fuzz --bins -- -D warnings
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--deny rustdoc::broken_intra_doc_links --deny warnings"
