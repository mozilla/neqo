name: Fuzz & Bench
on:
  workflow_dispatch:
  pull_request:
    # `edited` so a retargeted PR gets a run, see codspeed.yml. Only base changes run jobs.
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  # Non-base edits skip all jobs, so they must not cancel the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-bench:
    name: Check that the fuzz and bench targets work
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15] # FIXME: ubuntu-24.04-arm has issues
        check: [fuzz, bench]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-build-deps
        with:
          version: nightly

      - name: Install cargo-fuzz
        if: ${{ matrix.check == 'fuzz' }}
        # cargo-fuzz must be compiled from source so it targets the native toolchain;
        # binstall provides prebuilt binaries that may target a different architecture.
        run: cargo install cargo-fuzz

      - if: ${{ matrix.check == 'fuzz' }}
        env:
          UBUNTU: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          cargo fuzz build --dev
          for fuzzer in $(cargo fuzz list); do
            cargo fuzz run --dev --sanitizer none "$fuzzer" -- -runs=1
          done

      - if: ${{ matrix.check == 'bench' }}
        run: cargo bench --features bench --profile dev --  --profile-time 1
