name: Check README.md
on:
  pull_request:
    # `edited` so a retargeted PR gets a run, see codspeed.yml. Only base changes run jobs.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

concurrency:
  # Non-base edits skip all jobs, so they must not cancel the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readme:
    name: Check README.md
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/install-build-deps
        with:
          tools: cargo-readme
          nss: "false"

      - run: |
          cd mtu # Only works for this crate currently.
          # TODO: cargo-readme doesn't support workspaces: https://github.com/webern/cargo-readme/issues/81
          # Leaving this here so we remember to fix it later.
          # cargo readme -o /tmp/README.md
          # diff -u README.md /tmp/README.md
