name: Lint GitHub Actions workflows
on:
  push:
    branches: ["main"]
    paths: [".github/**"]
  pull_request:
    # `edited` so a retargeted PR gets a run, see codspeed.yml. Only base changes run jobs.
    types: [opened, synchronize, reopened, edited]
    paths: [".github/**"]
  merge_group:

concurrency:
  # Non-base edits skip all jobs, so they must not cancel the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    uses: mozilla/actions/.github/workflows/actionlint.yml@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results.
