name: cargo bench
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
env:
  CARGO_PROFILE_RELEASE_DEBUG: true
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  RUSTUP_TOOLCHAIN: stable
  # `cycles:u` stays first: samply makes the first `-e` event its sample table, the rest markers.
  # Per-symbol IPC comes from the `perf report` dumps. No cache or TLB events: only 4 counters.
  PERF_OPT: record -N -F2999 --call-graph fp -e cycles:u,cycles/freq=999/k,instructions/freq=999/u,page-faults,major-faults,cpu-migrations,kmem:rss_stat,sched:sched_switch -m 4096
  # Exact counts, so IPC has no sampling error. `--no-big-num`, as separators are locale-dependent.
  # Tracepoints cost none of the four counters. With the `lo` deltas: sends per byte.
  PERF_TRACEPOINTS: syscalls:sys_enter_sendmsg,syscalls:sys_enter_sendmmsg,syscalls:sys_enter_recvmsg,syscalls:sys_enter_recvmmsg
  PERF_STAT_OPT: stat --no-big-num -e instructions:u,cycles:u,cycles:k,task-clock,page-faults,major-faults,context-switches,cpu-migrations
  MTU: 1500
  CFLAGS: -fno-omit-frame-pointer
  CXXFLAGS: -fno-omit-frame-pointer
  WORKSPACE: ${{ github.workspace }}
  BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build bench binaries
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          submodules: "recursive"
          persist-credentials: false

      - uses: $/.github/actions/build-neqo
        with:
          artifact-name: bench-build
          benches: "true"
          baseline-ref: origin/${{ env.BASE_REF }}

  build-samply:
    uses: $/.github/workflows/build-samply.yml

  bench-variants:
    name: Determine benchmarks
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      benchmarks: ${{ steps.benchmarks.outputs.benchmarks }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-build
          path: dist

      - name: Enumerate benchmarks
        id: benchmarks
        run: |
          chmod +x dist/neqo/* dist/neqo-baseline/*
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/dist/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TEST_FIXTURE_DB="$GITHUB_WORKSPACE/dist/test-fixture/db"

          variants() {
            "$1" --bench --list 2>/dev/null | sed -n 's/: benchmark$//p' || true
          }

          {
            for PR_BENCH in dist/neqo/*; do
              BIN_NAME=${PR_BENCH##*/}
              case "$BIN_NAME" in
                neqo-client|neqo-server) continue ;;
              esac
              VARIANTS=$(variants "$PR_BENCH")
              if [ -n "$VARIANTS" ]; then
                while IFS= read -r VARIANT; do
                  jq -cn --arg bench "$BIN_NAME" --arg variant "$VARIANT" \
                    '{bench: $bench, variant: $variant}'
                done <<< "$VARIANTS"
              else
                jq -cn --arg bench "$BIN_NAME" '{bench: $bench, variant: ""}'
              fi
            done
          } | jq -sc 'to_entries | map({id: .key, bench: .value.bench, variant: .value.variant})' > benchmarks.json

          echo "benchmarks=$(<benchmarks.json)" >> "$GITHUB_OUTPUT"

  bench:
    name: cargo bench (${{ matrix.benchmark.bench }} ${{ matrix.benchmark.variant }})
    runs-on: codspeed-macro-x86-ryzen-9950x-ubuntu-24-04 # zizmor: ignore[self-hosted-runner]
    needs: [build, build-samply, bench-variants]
    if: ${{ needs.bench-variants.outputs.benchmarks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        benchmark: ${{ fromJSON(needs.bench-variants.outputs.benchmarks) }}
    env:
      BENCHMARK_NAME: ${{ matrix.benchmark.bench }}
      BENCHMARK_VARIANT: ${{ matrix.benchmark.variant }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          persist-credentials: false
      - run: |
          cd neqo
          git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Install Rust
        uses: $/.github/actions/install-build-deps
        with:
          version: ${{ env.RUSTUP_TOOLCHAIN }}
          tools: inferno
          nss: "false" # Uses the NSS libraries bundled with the downloaded binaries.
          rust-cache: "false"

      - uses: $/.github/actions/install-samply

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-build
          path: dist

      - name: Set up build artifacts
        run: |
          chmod +x dist/neqo/* dist/neqo-baseline/*
          {
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/dist/lib:$LD_LIBRARY_PATH"
            echo "TEST_FIXTURE_DB=$GITHUB_WORKSPACE/dist/test-fixture/db"
          } >> "$GITHUB_ENV"

      - name: Prepare machine
        id: machine
        uses: $/.github/actions/bench-machine
        with:
          mtu: ${{ env.MTU }}

      - name: Run cargo bench
        env:
          BENCH_CPUS: ${{ steps.machine.outputs.bench-cpus }} # Two: the benches serve from a thread.
        run: |
          # `MTU` is part of the benchmark names `--exact` matches; `LC_ALL=C` keeps perf parseable.
          bench_exec() { env "MTU=$MTU" "LC_ALL=C" setarch --addr-no-randomize taskset -c "$BENCH_CPUS" "$@"; }
          # Only `perf` needs root, for the tracepoints; `sudo` resets NSS's paths.
          perf_exec() { sudo env "MTU=$MTU" "LC_ALL=C" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "TEST_FIXTURE_DB=$TEST_FIXTURE_DB" setarch --addr-no-randomize taskset -c "$BENCH_CPUS" perf "$@"; }
          shopt -s extglob nullglob

          cd neqo
          # Run the baseline and PR builds interleaved for this benchmark.
          sanitize_name() { echo "$1" | tr '/ ()' '___-' | tr -s '_'; }
          variants() { "$1" --bench --list 2>/dev/null | sed -n 's/: benchmark$//p' || true; }
          PR_BENCH="../dist/neqo/$BENCHMARK_NAME"
          BASELINE_BENCH="../dist/neqo-baseline/$BENCHMARK_NAME"
          [ -f "$BASELINE_BENCH" ] || BASELINE_BENCH=""
          [ -x "$PR_BENCH" ] || { echo "::error::Missing benchmark $PR_BENCH"; exit 1; }

          if [ -n "$BENCHMARK_VARIANT" ]; then
            if [ -n "$BASELINE_BENCH" ] && grep -qxF "$BENCHMARK_VARIANT" < <(variants "$BASELINE_BENCH"); then
              bench_exec "$BASELINE_BENCH" --bench --save-baseline baseline --noplot --exact "$BENCHMARK_VARIANT" | tee -a ../results-baseline.txt
            fi
            # --baseline-lenient allows us to add new benchmarks in pull requests.
            bench_exec "$PR_BENCH" --bench --baseline-lenient baseline --noplot --exact "$BENCHMARK_VARIANT" | tee -a ../results.txt
          else
            [ -n "$BASELINE_BENCH" ] && bench_exec "$BASELINE_BENCH" --bench --save-baseline baseline --noplot | tee -a ../results-baseline.txt
            bench_exec "$PR_BENCH" --bench --baseline-lenient baseline --noplot | tee -a ../results.txt
          fi
          lo_stat() { cat "/sys/class/net/lo/statistics/$1"; }
          # Run `perf $1` on the benchmark in $3.., writing to $2, and append the `lo` deltas
          # like `perf stat`'s own lines: into its output, or beside the binary `perf.data`.
          measure() {
            local sub="$1" out="$2" tx pkt; shift 2
            tx=$(lo_stat tx_bytes); pkt=$(lo_stat tx_packets)
            # shellcheck disable=SC2086
            perf_exec $sub -o "$out" "$@"
            [ "${out##*.}" = txt ] || out="$out.lo"
            printf '%20s      lo-tx-bytes\n%20s      lo-tx-packets\n' \
              "$(( $(lo_stat tx_bytes) - tx ))" "$(( $(lo_stat tx_packets) - pkt ))" \
              | sudo tee -a "$out" >/dev/null # `$out` is root-owned, `perf` wrote it.
          }
          # Run `perf $1` over this benchmark for $5 seconds, writing $4 under $3/<side>/.
          # The transfers run over `[::1]`, so `lo` sees exactly them. Compare per byte:
          # criterion fits whole iterations in, so the sides do different amounts of work.
          perf_one() {
            local subcmd="$1" side="$2" out_root="$3" ext="$4" secs="$5"
            local bench="../dist/$side/$BENCHMARK_NAME" out="$out_root/$side"
            local safe_name="$BENCHMARK_NAME"
            [ -f "$bench" ] || return 0
            mkdir -p "$out"
            if [ -n "$BENCHMARK_VARIANT" ]; then
              safe_name="${safe_name}_$(sanitize_name "$BENCHMARK_VARIANT")"
              measure "$subcmd" "$out/$safe_name.$ext" "$bench" --bench --noplot --profile-time "$secs" --exact "$BENCHMARK_VARIANT"
            else
              measure "$subcmd" "$out/$safe_name.$ext" "$bench" --bench --noplot --profile-time "$secs"
            fi
          }
          # `perf stat` fails outright on an event it cannot open, so add the tracepoints
          # only once they open. Probe them alone, or another event's failure is blamed here.
          if perf_exec stat -e "$PERF_TRACEPOINTS" -- true >/dev/null 2>&1; then
            PERF_STAT_OPT="$PERF_STAT_OPT,$PERF_TRACEPOINTS"
          else
            echo "::warning::syscall tracepoints unavailable, continuing without them"
          fi
          # `stat` for both sides first, so `record`'s overhead cannot skew the IPC comparison.
          for SIDE in neqo neqo-baseline; do
            perf_one "$PERF_STAT_OPT" "$SIDE" ../stats txt 5
          done
          # Longer, because the flamegraphs need samples, not just an exact ratio.
          for SIDE in neqo neqo-baseline; do
            perf_one "$PERF_OPT" "$SIDE" ../profiles perf 15
          done
          sudo chown -R "$(id -u)" ../profiles ../stats # Take back what root `perf` wrote.

      - name: Post-process perf data
        timeout-minutes: 30
        uses: $/.github/actions/process-perf
        with:
          path: profiles/*/*.perf
          reports: "true"

      - name: Record benchmark failure
        if: failure()
        run: |
          mkdir -p benchmark-status
          echo "${BENCHMARK_NAME} ${BENCHMARK_VARIANT} failed; see the job log" > benchmark-status/failed

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.benchmark.id }}
          path: |
            profiles/*/*.samply.json.gz
            profiles/*/*.svg
            profiles/*/*.report.txt
            profiles/*/*.lo
            stats/*/*.txt
            results.txt
            results-baseline.txt
            benchmark-status
          if-no-files-found: ignore
          compression-level: 9

  results:
    name: Assemble benchmark results
    if: ${{ !cancelled() }}
    needs: bench
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          persist-credentials: false
      - run: |
          cd neqo
          git fetch --no-tags --depth=1 origin "$BASE_REF"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-*
          path: benchmarks

      - name: Merge benchmark results
        run: |
          set -euo pipefail
          shopt -s nullglob
          : > results.txt
          : > results-baseline.txt
          mkdir -p profiles/neqo profiles/neqo-baseline stats/neqo stats/neqo-baseline
          : > failed-benchmarks.txt

          for benchmark in benchmarks/benchmark-*; do
            [ -d "$benchmark" ] || continue
            cat "$benchmark/results.txt" >> results.txt 2>/dev/null || true
            cat "$benchmark/results-baseline.txt" >> results-baseline.txt 2>/dev/null || true
            cat "$benchmark/benchmark-status/failed" >> failed-benchmarks.txt 2>/dev/null || true
            for side in neqo neqo-baseline; do
              if [ -d "$benchmark/profiles/$side" ]; then
                cp -a "$benchmark/profiles/$side/." "profiles/$side/"
              fi
              if [ -d "$benchmark/stats/$side" ]; then
                cp -a "$benchmark/stats/$side/." "stats/$side/"
              fi
            done
          done

      - name: Format results as Markdown
        id: results
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          SHA=$(cd neqo && git log origin/"$BASE_REF" -1 --format=%H)
          echo "$SHA" > baseline-sha.txt
          python3 neqo/.github/scripts/format-bench-results.py results.txt stats
          # Build final markdown output
          {
            echo "### Benchmark results"
            echo
            if [ -s significant-results.md ]; then
              echo "Significant performance differences relative to $SHA."
              cat significant-results.md
            else
              echo "No significant performance differences relative to $SHA."
            fi
            echo
            echo "<details><summary>All results</summary>"
            echo
            cat all-bench-results.md
            echo
            echo "</details>"
            if [ -s perf-stat.md ]; then
              echo
              cat perf-stat.md
            fi
          } > results.md
          rm -f all-bench-results.md significant-results.md perf-stat.md
          cat results.md > "$GITHUB_STEP_SUMMARY"
          cp "$EVENT_PATH" event.json

      - name: Export profiler.firefox.com data
        id: export_samply
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.event.pull_request.head.sha }}-bench-samply
          path: |
            profiles/*/*.samply.json.gz
          compression-level: 9

      - name: Export performance data
        id: export_perf
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.event.pull_request.head.sha }}-bench-perf
          path: |
            profiles/*/*.svg
            profiles/*/*.report.txt
            profiles/*/*.lo
            stats/*/*.txt
            *.txt
            *.md
            event.json
            results.*
            results-baseline.*
          compression-level: 9

      - name: Export PR comment data
        uses: $/.github/actions/pr-comment-data-export
        with:
          name: ${{ github.workflow }}
          contents: results.md
          log-md: ${{ format('[Download data for `profiler.firefox.com`]({0}) or [download performance comparison data]({1}).', steps.export_samply.outputs.artifact-url, steps.export_perf.outputs.artifact-url) }}

      - name: Fail on regression
        # Don't check for regressions when running on main.
        if: github.ref != 'refs/heads/main' && github.event.merge_group.base_ref != 'refs/heads/main'
        run: |
          if grep -q "Performance has regressed." results.txt; then
            echo "Performance regression detected."
            exit 1
          else
            echo "No performance regression detected."
          fi

      - name: Fail on benchmark errors
        if: always()
        run: |
          if [ -s failed-benchmarks.txt ]; then
            cat failed-benchmarks.txt
            exit 1
          fi
