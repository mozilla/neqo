# Publish a Docker image for QNS (QUIC Network Simulator) to GitHub Container Registry.
# https://interop.seemann.io/ uses this image to run interop tests.

name: Publish QNS Docker Image
on:
  workflow_dispatch:
  schedule:
    # Run at 1 AM each day, so the interop-runner has a current image.
    - cron: "0 1 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    permissions:
      packages: write # Required to push to GitHub Container Registry.
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-qns
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: qns/Dockerfile
          build-args: RUST_VERSION=stable
          platforms: linux/amd64, linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-qns:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-qns:buildcache,mode=max
