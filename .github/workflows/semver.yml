name: Check semver
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver:
    name: Check semver
    runs-on: ubuntu-26.04
    steps:
      - uses: mozilla/actions/semver@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
        with:
          package: mtu
