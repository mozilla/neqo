name: Check semver
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver:
    name: Check semver
    runs-on: ubuntu-26.04
    steps:
      - uses: mozilla/actions/semver@80429d96b44ae13c8cfe2a2dbec978ffc31c3720 # v3.3.0
        with:
          package: mtu
