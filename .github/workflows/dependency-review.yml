# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: "Dependency Review"
on:
  pull_request:
    # `edited` so a retargeted PR gets a run, see codspeed.yml. Only base changes run jobs.
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  # Non-base edits skip all jobs, so they must not cancel the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    uses: mozilla/actions/.github/workflows/dependency-review.yml@32d84c77ea1bb513afbd253f94f67ae138b7d8be # v2.0.10
