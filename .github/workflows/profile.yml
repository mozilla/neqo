name: Profile
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable
  TRANSFER_SIZE: 33554432 # 32 MiB
  # See bench.yml for the event choices; `cycles:u` has to stay first.
  PERF_OPT: record -N -F2999 --call-graph fp -e cycles:u,cycles/freq=999/k,instructions/freq=999/u,page-faults,major-faults,context-switches,cpu-migrations,kmem:rss_stat,sched:sched_switch -m 4096
  # Profiling build settings; see also bench.yml and perfcompare.yml. `RUSTFLAGS` is needed here
  # because this workflow builds neqo inline rather than via the build-neqo action.
  CARGO_PROFILE_RELEASE_DEBUG: true
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  CFLAGS: -fno-omit-frame-pointer
  CXXFLAGS: -fno-omit-frame-pointer
  RUSTFLAGS: -C force-frame-pointers=yes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench-matrix:
    name: Determine bench matrix and refs
    runs-on: ubuntu-24.04
    outputs:
      benches: ${{ steps.matrix.outputs.all }}
      # Only profile the baseline (PR base branch) on pull requests
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: ./.github/actions/bench-matrix
      - id: refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "refs=[{\"name\":\"pr\",\"sha\":\"$HEAD_SHA\"},{\"name\":\"base\",\"sha\":\"$BASE_SHA\"}]" >> "$GITHUB_OUTPUT"
          else
            echo 'refs=[{"name":"pr","sha":""}]' >> "$GITHUB_OUTPUT"
          fi

  build-others:
    name: Build ${{ matrix.impl }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        impl: [quiche, s2n]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/quic-build
        with:
          impl: ${{ matrix.impl }}
          artifact-name: ${{ matrix.impl }}-binaries

  # The released samply ignores `--presymbolicate` when importing, so the profiles would carry no
  # symbols. Build it once here rather than in every profiling job.
  build-samply:
    name: Build samply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/install-build-deps
        with:
          version: stable
          nss: "false"
          rust-cache: "false"
      - name: Resolve samply revision
        id: samply
        run: echo "rev=$(git ls-remote https://github.com/mstange/samply main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: samply/bin/samply
          key: samply-${{ runner.os }}-${{ runner.arch }}-${{ steps.samply.outputs.rev }}
      - name: Build samply
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REV: ${{ steps.samply.outputs.rev }}
          # This build doesn't need the profiling settings the rest of the workflow uses.
          CARGO_PROFILE_RELEASE_DEBUG: false
          CARGO_PROFILE_RELEASE_LTO: false
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          RUSTFLAGS: ""
        run: cargo install --locked --git https://github.com/mstange/samply --rev "$REV" --root samply samply
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samply
          path: samply/bin/samply
          retention-days: 1

  build-neqo:
    name: Build neqo (${{ matrix.ref.name }})
    runs-on: ubuntu-24.04
    needs: bench-matrix
    strategy:
      matrix:
        ref: ${{ fromJson(needs.bench-matrix.outputs.refs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref.sha }}

      - uses: $/.github/actions/install-build-deps
        with:
          version: stable

      - name: Build neqo
        run: |
          cargo build --locked --release --features bench --bin neqo-client --bin neqo-server
          mkdir -p binaries
          cp target/release/neqo-client target/release/neqo-server binaries/
          NSS_DB=$(cargo metadata --format-version 1 | jq -r 'first(.packages[] | select(.name == "test-fixture" and (.source // "" | startswith("git+"))) | .manifest_path | rtrimstr("/Cargo.toml"))')/db
          mkdir -p binaries/test-fixture
          cp -r "$NSS_DB" binaries/test-fixture/

      - uses: $/.github/actions/bundle-nss
        with:
          path: binaries

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neqo-binaries-${{ matrix.ref.name }}
          path: binaries
          retention-days: 1

  bench-profile:
    name: Profile ${{ matrix.bench.bench }} (${{ matrix.ref.name }})
    runs-on: ubuntu-24.04
    needs: [bench-matrix, build-samply]
    if: ${{ needs.bench-matrix.outputs.benches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJson(needs.bench-matrix.outputs.benches) }}
        ref: ${{ fromJson(needs.bench-matrix.outputs.refs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref.sha }}

      - uses: $/.github/actions/install-build-deps
        with:
          version: stable

      - uses: $/.github/actions/install-samply

      - name: Build benchmark
        env:
          CRATE: ${{ matrix.bench.crate }}
          BENCH: ${{ matrix.bench.bench }}
          REF: ${{ matrix.ref.name }}
        run: |
          mkdir -p binaries
          if cargo bench --locked --package "$CRATE" --features bench --bench "$BENCH" --no-run 2>&1 | tee bench-build.txt; then
            BENCH_BIN=$(grep Executable bench-build.txt | cut -d'(' -f2 | cut -d')' -f1)
            cp "$BENCH_BIN" "binaries/$BENCH"
          elif [ "$REF" = "base" ]; then
            # The bench may not exist on the base ref if it's new in this PR.
            echo "::warning::Bench $BENCH not found on base ref; skipping."
          else
            exit 1
          fi

      - uses: $/.github/actions/enable-perf

      - name: Record perf
        env:
          BENCH: ${{ matrix.bench.bench }}
        run: |
          # The binary is absent when the bench doesn't exist on the base ref.
          if [ -f "binaries/$BENCH" ]; then
            # shellcheck disable=SC2086
            sudo env LD_LIBRARY_PATH="$LD_LIBRARY_PATH" CRITERION_HOME=/tmp/criterion perf $PERF_OPT -o "$BENCH.perf" -- "binaries/$BENCH" --bench --noplot || true
            [ -f "$BENCH.perf" ] || { echo "::error::perf produced no data for $BENCH"; exit 1; }
          fi

      - name: Process perf data
        timeout-minutes: 30
        run: |
          fail=
          for f in *.perf; do
            [ -e "$f" ] || continue
            sudo chown "$(id -u)" "$f"
            if [ -z "$(perf script -i "$f" | head -n1)" ]; then
              echo "::error::perf recorded no samples for $f"
              fail=1
              continue
            fi
            echo "Processing $f..."
            samply import "$f" -o "${f%.perf}.samply.json.gz" --save-only --presymbolicate ||
              { echo "::error::samply import failed for $f"; fail=1; }
          done
          [ -z "$fail" ]

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.bench.crate }}-${{ matrix.bench.bench }}-${{ matrix.ref.name }}
          path: |
            *.samply.json.gz
            binaries
          retention-days: 90
          if-no-files-found: ignore

  perfcompare-profile:
    name: Profile ${{ matrix.combo.client }}-${{ matrix.combo.server }} (${{ matrix.ref.name }})
    runs-on: ubuntu-24.04
    needs: [bench-matrix, build-others, build-neqo, build-samply]
    if: ${{ !cancelled() && needs.bench-matrix.result == 'success' && needs.build-neqo.result == 'success' && needs.build-samply.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { client: neqo, server: neqo }
          - { client: neqo, server: quiche }
          - { client: quiche, server: neqo }
          - { client: neqo, server: s2n }
          - { client: s2n, server: neqo }
        ref: ${{ fromJson(needs.bench-matrix.outputs.refs) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref.sha }}

      - uses: $/.github/actions/install-build-deps
        with:
          version: stable
          nss: "false" # Uses the NSS libraries bundled with the downloaded binaries.

      - uses: $/.github/actions/install-samply

      - name: Download neqo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neqo-binaries-${{ matrix.ref.name }}
          path: binaries

      - name: Set library and NSS database paths
        run: |
          {
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/binaries/lib:$LD_LIBRARY_PATH"
            echo "TEST_FIXTURE_DB=$GITHUB_WORKSPACE/binaries/test-fixture/db"
          } >> "$GITHUB_ENV"

      - name: Download external impl binaries
        if: matrix.combo.client != 'neqo' || matrix.combo.server != 'neqo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          CLIENT: ${{ matrix.combo.client }}
          SERVER: ${{ matrix.combo.server }}
        run: |
          for impl in "$CLIENT" "$SERVER"; do
            [ "$impl" = "neqo" ] && continue
            gh run download "$RUN_ID" --name "$impl-binaries" --dir binaries
          done

      - name: Fix binary permissions
        run: chmod +x binaries/*

      - name: Calculate perf size
        run: echo "PERF_SIZE=$((TRANSFER_SIZE * 20))" >> "$GITHUB_ENV"

      - name: Setup test environment
        uses: ./.github/actions/testdata-setup
        with:
          sizes: ${{ env.PERF_SIZE }}

      - name: Generate commands
        id: commands
        uses: ./.github/actions/perfcompare-commands
        with:
          client: ${{ matrix.combo.client }}
          server: ${{ matrix.combo.server }}
          size: ${{ env.PERF_SIZE }}

      - name: Set command environment
        env:
          BENCH_NAME: ${{ steps.commands.outputs.bench-name }}
          SERVER_CMD: ${{ steps.commands.outputs.server-cmd }}
          CLIENT_CMD: ${{ steps.commands.outputs.client-cmd }}
        run: |
          {
            echo "BENCH_NAME=$BENCH_NAME"
            echo "SERVER_CMD=$SERVER_CMD"
            echo "CLIENT_CMD=$CLIENT_CMD"
          } >> "$GITHUB_ENV"

      - uses: $/.github/actions/enable-perf

      - name: Record perf
        run: |
          # shellcheck disable=SC2206
          PERF=(sudo env "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "TEST_FIXTURE_DB=$TEST_FIXTURE_DB" perf $PERF_OPT)
          # Some commands wrap the binary in `bash -c "..."`; the quoting has to survive word splitting.
          eval "set -- $SERVER_CMD"
          "${PERF[@]}" -o "$BENCH_NAME.server.perf" -- "$@" &
          SERVER_PID=$!
          sleep 1
          eval "set -- $CLIENT_CMD"
          "${PERF[@]}" -o "$BENCH_NAME.client.perf" -- "$@" || echo "::warning::client exited with status $?"
          sudo kill "$SERVER_PID" 2>/dev/null || true
          # Wait for perf to finish writing its data file.
          wait "$SERVER_PID" || true
          for role in server client; do
            [ -f "$BENCH_NAME.$role.perf" ] || { echo "::error::perf produced no data for $role"; exit 1; }
          done

      - name: Process perf data
        timeout-minutes: 30
        run: |
          fail=
          for f in *.perf; do
            [ -e "$f" ] || continue
            sudo chown "$(id -u)" "$f"
            if [ -z "$(perf script -i "$f" | head -n1)" ]; then
              echo "::error::perf recorded no samples for $f"
              fail=1
              continue
            fi
            echo "Processing $f..."
            samply import "$f" -o "${f%.perf}.samply.json.gz" --save-only --presymbolicate ||
              { echo "::error::samply import failed for $f"; fail=1; }
          done
          [ -z "$fail" ]

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfcompare-${{ matrix.combo.client }}-${{ matrix.combo.server }}-${{ matrix.ref.name }}
          path: |
            *.samply.json.gz
            binaries
          retention-days: 90
          if-no-files-found: ignore

  pr-comment:
    name: PR Comment
    needs: [bench-profile, perfcompare-profile]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" |
            jq '[.[].artifacts[]]' > artifacts.json
          section() {
            jq -r --arg prefix "$1" --arg title "$2" '
              [.[] | select(.name | startswith($prefix))]
              | group_by(.name | sub("-(pr|base)$"; ""))
              | select(length > 0)
              | "<details><summary>\($title) (\(length))</summary>\n",
                (.[]
                 | . as $g
                 | ($g[0].name | sub("-(pr|base)$"; "") | sub("^(bench|perfcompare)-"; "")) as $name
                 | ["pr", "base"]
                   | map(. as $ref
                         | ($g[] | select(.name | endswith("-" + $ref)))
                         | "[\($ref)](\(.archive_download_url | sub("api.github.com/repos"; "github.com") | sub("/zip"; "")))")
                   | "- \($name): \(join(" · "))"),
                "\n</details>\n"
            ' artifacts.json
          }
          {
            echo "### Performance profiles for [profiler.firefox.com](https://profiler.firefox.com/)"
            echo
            if jq -e 'any(.[]; .name | endswith("-pr"))' artifacts.json > /dev/null; then
              section bench- "Benchmarks"
              section perfcompare- "Comparisons"
            else
              echo "No performance profiles were generated."
            fi
          } > results.md

      - uses: ./.github/actions/pr-comment-data-export
        with:
          name: ${{ github.workflow }}
          contents: results.md
