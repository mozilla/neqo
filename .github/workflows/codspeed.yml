name: CodSpeed
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench-matrix:
    name: Determine bench matrix
    runs-on: ubuntu-24.04
    outputs:
      benches: ${{ steps.matrix.outputs.benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: $/.github/actions/bench-matrix

  benchmarks:
    name: Run ${{ matrix.bench.bench }} (${{ matrix.bench.mode }})
    runs-on: codspeed-macro-x86-ryzen-9950x-ubuntu-24-04 # zizmor: ignore[self-hosted-runner]
    # TODO: Restore `environment: codspeed` once GitHub supports filtering deployment messages.
    # environment: codspeed
    needs: bench-matrix
    if: ${{ needs.bench-matrix.outputs.benches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJson(needs.bench-matrix.outputs.benches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image ships a toolchain with a different profile, and reconciling
      # against it hits an EXDEV rename bug in rustup, so install into a job-local home.
      - name: Use a fresh Rust toolchain home
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
          } >> "$GITHUB_ENV"

      - uses: $/.github/actions/install-build-deps
        with:
          version: stable
          tools: cargo-codspeed

      - name: Build bench
        env:
          BENCH: ${{ matrix.bench.bench }}
          CRATE: ${{ matrix.bench.crate }}
          MODE: ${{ matrix.bench.mode }}
        run: cargo codspeed build --package "$CRATE" --locked --features bench --bench "$BENCH" --measurement-mode "$MODE"

      - name: Set the loopback MTU # Same packetization as the other benchmark workflows.
        env:
          MTU: 1500 # Step-scoped: `neqo-bin` benches append `/mtu-$MTU` to their names.
        run: sudo ip link set dev lo mtu "$MTU"

      - name: Run bench & upload results
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.bench.mode }}
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }} # zizmor: ignore[secrets-outside-env]
