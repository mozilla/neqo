name: Claude Code Review
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    uses: mozilla/actions/.github/workflows/claude-review.yml@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
    permissions:
      contents: read
      pull-requests: write # Required to post review comments.
      issues: read # Required for gh issue view.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
