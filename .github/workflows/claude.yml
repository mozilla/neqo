name: Claude Code Review
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    uses: mozilla/actions/.github/workflows/claude-review.yml@a2f86e00e93d54a5c56689e15633eeb3ef1bf671 # v3.1.0
    permissions:
      contents: read
      pull-requests: write # Required to post review comments.
      issues: read # Required for gh issue view.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
