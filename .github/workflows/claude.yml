name: Claude Code Review
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    uses: mozilla/actions/.github/workflows/claude-review.yml@42622e57e54d96514373f5234c0220b014e64740 # v3.1.1
    permissions:
      contents: read
      pull-requests: write # Required to post review comments.
      issues: read # Required for gh issue view.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
