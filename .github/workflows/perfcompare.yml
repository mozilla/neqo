name: Performance comparison
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
env:
  CARGO_PROFILE_RELEASE_DEBUG: true
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  RUSTUP_TOOLCHAIN: stable
  # See bench.yml for the event choices; `cycles:u` has to stay first.
  PERF_OPT: record -N -F2999 --call-graph fp -e cycles:u,cycles/freq=999/k,instructions/freq=999/u,page-faults,major-faults,cpu-migrations,kmem:rss_stat,sched:sched_switch -m 4096
  MTU: 1500
  SIZE: 33554432 # Both the measuring jobs and the table header need these.
  RUNS: 100
  CFLAGS: -fno-omit-frame-pointer
  CXXFLAGS: -fno-omit-frame-pointer
  # `--call-graph fp` needs frame pointers, which x86_64 Rust omits by default. build-neqo appends
  # this itself; the peer implementations built by quic-build need it from here.
  RUSTFLAGS: -C force-frame-pointers=yes
  BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-neqo:
    name: Build neqo
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          submodules: "recursive"
          persist-credentials: false

      - uses: $/.github/actions/build-neqo
        with:
          artifact-name: build-neqo
          baseline-ref: origin/${{ env.BASE_REF }}

  build-others:
    name: Build ${{ matrix.impl }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        impl: [google, quiche, s2n]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions # Cone mode also gets the Cargo.toml rust-cache needs.
          persist-credentials: false

      - uses: $/.github/actions/quic-build
        with:
          impl: ${{ matrix.impl }}
          artifact-name: build-${{ matrix.impl }} # perfcompare.py's commands start with this.

  build-samply:
    uses: $/.github/workflows/build-samply.yml

  units:
    name: Determine comparison units
    runs-on: ubuntu-24.04
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: units
        shell: bash
        run: echo "units=$(python3 .github/scripts/perfcompare.py --list-units)" >> "$GITHUB_OUTPUT"

  perfcompare:
    name: ${{ matrix.unit }}
    runs-on: codspeed-macro-x86-ryzen-9950x-ubuntu-24-04 # zizmor: ignore[self-hosted-runner]
    needs: [units, build-neqo, build-others, build-samply]
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.units.outputs.units) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          persist-credentials: false
      - run: |
          cd neqo
          git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Install Rust
        uses: $/.github/actions/install-build-deps
        with:
          version: ${{ env.RUSTUP_TOOLCHAIN }}
          tools: hyperfine, inferno
          nss: "false" # Uses the NSS libraries bundled with the downloaded binaries.
          rust-cache: "false"

      - uses: $/.github/actions/install-samply

      - name: Install SciPy # perfcompare.py's Mann-Whitney test needs it.
        run: |
          [ "$APT_UPDATED" ] || sudo apt-get update && echo "APT_UPDATED=1" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends python3-scipy

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-* # Each unpacks into a directory named after it.
          path: .

      - name: Set up build artifacts
        run: |
          chmod +x build-neqo/neqo/* build-neqo/neqo-baseline/* \
            build-google/* build-quiche/* build-s2n/*
          {
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build-neqo/lib:$LD_LIBRARY_PATH"
            echo "TEST_FIXTURE_DB=$GITHUB_WORKSPACE/build-neqo/test-fixture/db"
          } >> "$GITHUB_ENV"

      - name: Prepare machine
        id: machine
        uses: $/.github/actions/bench-machine
        with:
          mtu: ${{ env.MTU }}

      # Compare various configurations of neqo against google/quiche, and gather perf data
      # during the hyperfine runs.
      - name: Compare QUIC implementations
        env:
          WORKSPACE: ${{ github.workspace }}
          SERVER_CPU: ${{ steps.machine.outputs.server-cpu }}
          CLIENT_CPU: ${{ steps.machine.outputs.client-cpu }}
          UNIT: ${{ matrix.unit }}
        run: |
          python3 neqo/.github/scripts/perfcompare.py \
            --host 127.0.0.1 \
            --port 4433 \
            --size "$SIZE" \
            --runs "$RUNS" \
            --workspace "$WORKSPACE" \
            --perf-opt "$PERF_OPT" \
            --server-cpu "$SERVER_CPU" \
            --client-cpu "$CLIENT_CPU" \
            --unit "$UNIT"
          # Take back what root `perf` wrote.
          sudo chown -R "$(id -u)" ./*.perf hyperfine hyperfine-baseline 2>/dev/null || true

      - name: Post-process perf data
        timeout-minutes: 30
        uses: $/.github/actions/process-perf
        with:
          reports: "true"

      - name: Upload unit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfcompare-${{ matrix.unit }}
          path: |
            steps.md
            results.txt
            *.samply.json.gz
            *.svg
            *.report.txt
            hyperfine
            hyperfine-baseline
          retention-days: 1
          compression-level: 9

  results:
    name: Assemble comparison
    if: ${{ !cancelled() }}
    needs: perfcompare
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout mozilla/neqo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/neqo
          path: neqo
          persist-credentials: false
      - run: |
          cd neqo
          git fetch --no-tags --depth=1 origin "$BASE_REF"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perfcompare-*
          path: units

      - name: Merge unit results
        run: |
          python3 neqo/.github/scripts/perfcompare.py --merge units --size "$SIZE" --runs "$RUNS"

      - name: Format results as Markdown
        id: results
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          SHA=$(cd neqo && git log origin/"$BASE_REF" -1 --format=%H)
          echo "$SHA" > baseline-sha.txt
          {
            echo "### Client/server transfer results"
            echo
            echo "Performance differences relative to $SHA."
            echo
            # Extract rows with significant changes (red or green heart).
            if grep -q ':broken_heart:\|:green_heart:' comparison.md; then
              # Print all lines up to and including the first separator line (header)
              awk 'BEGIN{found=0} /^[|][ -|:]+[|]$/ {found=1} {print} found{exit}' comparison.md
              grep ':broken_heart:\|:green_heart:' comparison.md
              echo
            else
              echo "No significant performance differences."
              echo
            fi
            echo "Table above only shows statistically significant changes. See all results below."
            echo "<details><summary>All results</summary>"
            echo
            cat comparison.md
            echo
            echo "</details>"
          } >> results.md
          cat results.md > "$GITHUB_STEP_SUMMARY"
          cp "$EVENT_PATH" event.json

      - name: Export profiler.firefox.com data
        id: export_samply
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.event.pull_request.head.sha }}-perfcompare-samply
          path: |
            units/*/*.samply.json.gz
          compression-level: 9

      - name: Export performance data
        id: export_perf
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.event.pull_request.head.sha }}-perfcompare-perf
          path: |
            units/*/*.svg
            units/*/*.report.txt
            units/*/hyperfine
            units/*/hyperfine-baseline
            *.txt
            *.md
            event.json
          compression-level: 9

      - name: Export PR comment data
        uses: $/.github/actions/pr-comment-data-export
        with:
          name: ${{ github.workflow }}
          contents: results.md
          log-md: ${{ format('[Download data for `profiler.firefox.com`]({0}) or [download performance comparison data]({1}).', steps.export_samply.outputs.artifact-url, steps.export_perf.outputs.artifact-url) }}

      - name: Fail on regression
        # Don't check for regressions when running on main.
        if: github.ref != 'refs/heads/main' && github.event.merge_group.base_ref != 'refs/heads/main'
        run: |
          if grep -q "Performance has regressed." results.txt; then
            echo "Performance regression detected."
            exit 1
          else
            echo "No performance regression detected."
          fi
