# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # We don't really use Dependabot for Rust dependencies, since we are tracking Gecko
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable version and security updates.
    # <https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit>
    open-pull-requests-limit: 0
    # <https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#ignore-->
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    groups:
      mozilla-actions:
        patterns:
          - "mozilla/actions*"
      docker-actions:
        patterns:
          - "docker/*"
      vm-actions:
        patterns:
          - "vmactions/*"
    cooldown:
      default-days: 10
      # "semver" not supported for github-actions; see https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#configuration-of-cooldown
      # semver-major-days: 20
      # semver-minor-days: 10
      # semver-patch-days: 5
      exclude:
        - "mozilla/actions*"
  - package-ecosystem: "docker"
    directory: "/qns"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 10
      # "semver" not supported for docker; see https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#configuration-of-cooldown
      # semver-major-days: 20
      # semver-minor-days: 10
      # semver-patch-days: 5
