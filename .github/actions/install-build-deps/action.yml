name: Install build dependencies
description: Install Rust and, unless disabled, the NSS version required by nss-rs.

inputs:
  version:
    description: Rust toolchain version to install
    default: stable
  components:
    description: Rust components to install
    default: ""
  tools:
    description: Additional Rust tools to install
    default: ""
  target:
    description: Target triple; passed to both the Rust toolchain and the NSS build
    default: ""
  rust-cache:
    description: Whether to enable Rust dependency caching
    default: "true"
  cache-key:
    description: Extra component for the Rust cache key, to separate jobs that would otherwise share one entry
    default: ""
  nss:
    description: Whether to install NSS
    default: "true"
  working-directory:
    description: Directory containing the Cargo.toml that pins the NSS version
    default: "."
  token:
    description: A GitHub PAT
    required: true

runs:
  using: composite
  steps:
    - uses: mozilla/actions/rust@2152d1412122b04d838d6341aa3b4d6160b3de32 # v2.0.5
      with:
        version: ${{ inputs.version }}
        components: ${{ inputs.components }}
        tools: ${{ inputs.tools }}
        targets: ${{ inputs.target }}
        rust-cache: ${{ inputs.rust-cache }}
        cache-key: ${{ inputs.cache-key }}
        token: ${{ inputs.token }}

    - if: ${{ inputs.nss == 'true' }}
      uses: mozilla/nss-rs/install-nss@63c63046208f587573f71bb3885f16d10e0bf4eb # 0.14.6
      with:
        working-directory: ${{ inputs.working-directory }}
        target: ${{ inputs.target }}
        token: ${{ inputs.token }}
