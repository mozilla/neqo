name: Install build dependencies
description: Install Rust and, unless disabled, the NSS version required by nss-rs.

inputs:
  version:
    description: Rust toolchain version to install
    default: stable
  components:
    description: Rust components to install
    default: ""
  tools:
    description: Additional Rust tools to install
    default: ""
  target:
    description: Single target triple; passed to both the Rust toolchain and the NSS build
    default: ""
  workspaces:
    description: Newline-separated list of workspaces
    default: ""
  rust-cache:
    description: Whether to enable Rust dependency caching
    default: "true"
  cache-key:
    description: Extra component for the Rust cache key, to separate jobs that would otherwise share one entry
    default: ""
  sccache:
    description: Whether to enable sccache for Rust compilation caching
    default: "false"
  make-default:
    description: Whether to make the installed toolchain the default
    default: "true"
  nss:
    description: Whether to install NSS
    default: "true"
  working-directory:
    description: Directory containing the Cargo.toml that pins the NSS version
    default: "."
  token:
    description: A GitHub PAT; defaults to the job's `github.token`
    required: false

outputs:
  cache-key:
    description: The rust-cache shared-key this invocation would use
    value: ${{ steps.rust.outputs.cache-key }}
  cache-hit:
    description: Whether rust-cache restored an exact match (empty when caching is disabled)
    value: ${{ steps.rust.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: rust
      uses: mozilla/actions/rust@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
      with:
        version: ${{ inputs.version }}
        components: ${{ inputs.components }}
        tools: ${{ inputs.tools }}
        targets: ${{ inputs.target }}
        workspaces: ${{ inputs.workspaces }}
        rust-cache: ${{ inputs.rust-cache }}
        cache-key: ${{ inputs.cache-key }}
        sccache: ${{ inputs.sccache }}
        make-default: ${{ inputs.make-default }}
        token: ${{ inputs.token || github.token }}

    - if: ${{ inputs.nss == 'true' }}
      uses: mozilla/nss-rs/install-nss@dae19d45530acd2703fbba5f89a373a63ed7609a # 0.16.2
      with:
        working-directory: ${{ inputs.working-directory }}
        target: ${{ inputs.target }}
        token: ${{ inputs.token || github.token }}
