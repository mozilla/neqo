name: Build neqo
description: >
  Build neqo client/server and/or one benchmark for both main and PR branches, bundle
  NSS shared libraries and test fixtures, and upload everything as a single artifact.

inputs:
  artifact-name:
    description: Name for the uploaded artifact
    required: true
  bench:
    description: '"<crate> <bench>" of a benchmark to build, e.g. "neqo-transport pacer"'
    default: ""
  bins:
    description: Build the neqo-client and neqo-server binaries
    default: "true"
  ref:
    description: Which ref to build, `pr` or `baseline`; both if unset
    default: ""
  baseline-ref:
    description: Git ref to build baseline binaries from
    default: "origin/main"

runs:
  using: composite
  steps:
    - name: Install clang and lld
      shell: bash
      run: |
        [ "$APT_UPDATED" ] || sudo apt-get update && echo "APT_UPDATED=1" >> "$GITHUB_ENV"
        sudo apt-get install -y --no-install-recommends clang lld

    - name: Install Rust and NSS
      uses: $/.github/actions/install-build-deps
      with:
        version: stable
        working-directory: neqo

    - name: Build neqo
      shell: bash
      env:
        BENCH: ${{ inputs.bench }}
        BINS: ${{ inputs.bins }}
        REF: ${{ inputs.ref }}
        BASELINE_REF: ${{ inputs.baseline-ref }}
        CARGO_PROFILE_RELEASE_LTO: true
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      run: |
        # See https://github.com/flamegraph-rs/flamegraph for why we append to RUSTFLAGS here.
        export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-Wl,--no-rosegment -C force-frame-pointers=yes $RUSTFLAGS"
        mkdir -p dist/neqo-baseline dist/neqo
        read -r CRATE BENCH_NAME <<< "$BENCH"
        cd neqo
        # The baseline need not have a bench that is new in this PR.
        build() {
          local dest="$1" lenient="$2"
          if [[ "$BINS" == "true" ]]; then
            cargo build --locked --release --features bench --bin neqo-client --bin neqo-server
            cp target/release/neqo-client target/release/neqo-server "$dest/"
          fi
          [[ -z "$BENCH" ]] && return 0
          local meta
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          if [[ -n "$lenient" ]] && ! jq -e --arg p "$CRATE" --arg b "$BENCH_NAME" \
              '.packages[] | select(.name == $p) | .targets[] | select(.name == $b and (.kind | index("bench")))' \
              <<< "$meta" >/dev/null; then
            echo "::warning::Bench $BENCH_NAME does not exist on $BASELINE_REF; skipping."
            return 0
          fi
          cargo bench --package "$CRATE" --bench "$BENCH_NAME" --locked --features bench --no-run 2>&1 | tee benches.txt
          cp "$(grep Executable benches.txt | tail -n1 | cut -d\( -f2 | cut -d\) -f1)" "$dest/$BENCH_NAME"
        }
        if [[ "$REF" != "pr" ]]; then
          git fetch --no-tags --depth=1 origin "${BASELINE_REF#origin/}"
          git checkout "$BASELINE_REF"
          build ../dist/neqo-baseline lenient
          git checkout -
        fi
        [[ "$REF" == "baseline" ]] || build ../dist/neqo ""

    - name: Bundle NSS runtime files
      uses: $/.github/actions/bundle-nss
      with:
        path: dist
        working-directory: neqo

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: dist
        retention-days: 1
