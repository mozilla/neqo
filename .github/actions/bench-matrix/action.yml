name: Determine bench matrix
description: Determine the list of benchmarks from cargo metadata

outputs:
  benches:
    description: JSON array of benchmarks for CodSpeed
    value: ${{ steps.benches.outputs.benches }}
  all:
    description: JSON array of all unique crate/bench targets and their CPU mode
    value: ${{ steps.benches.outputs.all }}

runs:
  using: composite
  steps:
    - id: benches
      shell: bash
      run: |
        ALL_BENCHES=$(cargo metadata --no-deps --format-version 1 | jq -c '
          [.packages[] |
            . as $pkg |
            .targets[] |
            select(.kind[] == "bench") |
            select(has("required-features")) |
            .name as $bench_name |
            (($pkg.metadata.bench // []) | map(select(.name == $bench_name)) | .[0]) as $bench_meta |
            (($bench_meta.codspeed.mode) // "simulation") as $cpu_mode |
            (if $bench_meta.codspeed.memory == null then true else $bench_meta.codspeed.memory end) as $memory_enabled |
            (
              {
                crate: $pkg.name,
                bench: $bench_name,
                mode: $cpu_mode
              },
              if $memory_enabled then
                {
                  crate: $pkg.name,
                  bench: $bench_name,
                  mode: "memory"
                }
              else
                empty
              end
            )
          ]')

        # The memory entries repeat the CPU-mode ones.
        ALL_UNIQUE=$(echo "$ALL_BENCHES" | jq -c '
          [.[] | select(.mode != "memory") | {crate, bench, mode}] | unique')

        {
          echo "benches=$ALL_BENCHES"
          echo "all=$ALL_UNIQUE"
        } >> "$GITHUB_OUTPUT"
