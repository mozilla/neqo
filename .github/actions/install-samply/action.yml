name: Install samply
description: Install the samply built by the build-samply job, where cargo-binstall would put it.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: samply
        path: samply-bin
    - shell: bash
      run: |
        # Artifacts don't preserve the executable bit.
        mkdir -p "$HOME/.cargo/bin"
        install -m 755 samply-bin/samply "$HOME/.cargo/bin/samply"
        rm -rf samply-bin
        samply --version
