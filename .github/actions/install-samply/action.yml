name: Install samply
description: Install the samply built by the build-samply job, where cargo-binstall would put it.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: samply
        path: samply-bin
    - shell: bash
      run: |
        # Artifacts don't preserve the executable bit.
        mkdir -p "$HOME/.cargo/bin"
        install -m 755 samply-bin/samply "$HOME/.cargo/bin/samply"
        rm -rf samply-bin
        samply --version
